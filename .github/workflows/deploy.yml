name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [refactor]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup @antfu/ni
        run: npm i -g @antfu/ni

      - name: Install dependencies
        working-directory: slides
        run: nci

      - name: Compute Slidev base
        id: slidev_base
        run: |
          if [[ "${{ github.event.repository.name }}" == *".github.io" ]]; then
            echo "BASE=/slides/" >> "$GITHUB_ENV"
          else
            echo "BASE=/${{ github.event.repository.name }}/slides/" >> "$GITHUB_ENV"
          fi
      - name: Build Slidev into _site/slides
        working-directory: slides
        run: nr build --base "${BASE}" --out ../_site/slides


      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
